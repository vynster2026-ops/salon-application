name: Continuous Integration & Automated Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-audit:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: salon_submission

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: salon_submission/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax verification
        run: node --check server.js

      - name: Execute automated test suite
        run: npm test
        env:
          JWT_SECRET: "3ac08d0cccd1040aac739c4d30998672a1ef78ab22651c10d775a843b2e4be8a"
          NODE_ENV: test

