<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedhikaArts | Admin Portal Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            filter: blur(80px);
            opacity: 0.5;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-1);
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, 30px) scale(1.1);
            }

            100% {
                transform: translate(-30px, 80px) scale(0.9);
            }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--accent-1);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 2rem 1.5rem;
                width: 95%;
            }
        }
    </style>
    <!-- Clerk Authentication SDK -->
    <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Y2xlcmsubWVkaGlrYWFydHMuY29tJA"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
</head>

<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="auth-container">
        <div class="glass-card">
            <div class="brand-header">
                <div style="display: flex; justify-content: center; margin-bottom: 12px;">
                    <div
                        style="display: inline-flex; align-items: center; gap: 8px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.35); padding: 5px 14px; border-radius: 50px; backdrop-filter: blur(10px);">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z"
                                fill="#6366F1" />
                            <path
                                d="M12 4.18L19 8.07V12C19 16.4 16.03 20.5 12 21.78C7.97 20.5 5 16.4 5 12V8.07L12 4.18Z"
                                fill="#818CF8" />
                            <path d="M10 15.5L7.5 13L8.91 11.59L10 12.67L15.09 7.58L16.5 9L10 15.5Z" fill="white" />
                        </svg>
                        <span
                            style="color: #a5b4fc; font-weight: 700; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;">Secured
                            with Clerk</span>
                    </div>
                </div>
                <div class="logo">M</div>
                <h1 class="brand-title">MedhikaArts</h1>
                <div class="brand-subtitle">Salon Branch Portal</div>
            </div>

            <div id="alert-box" class="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Branch Access Key / Email</label>
                    <input type="text" id="access-key" class="form-control" placeholder="e.g. manager@branch.com"
                        required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="passcode" class="form-control" placeholder="Enter your password"
                        required>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;" id="btn-login">
                    <i class="fa-solid fa-shield-halved" style="margin-right: 8px;"></i> Authenticate via Clerk
                </button>
            </form>

            <div
                style="text-align: center; margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <p style="font-size: 12px; color: var(--text-secondary);">
                    Branch Portal Access · Enterprise Security Enforced
                </p>
                <div
                    style="font-size: 11px; color: #818cf8; font-weight: 600; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-lock" style="font-size: 10px;"></i> Secured with Clerk
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const btnLogin = document.getElementById('btn-login');

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
        const API_URL = isLocal ? 'http://localhost:5000' : '';

        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('access-key').value.trim();
            const password = document.getElementById('passcode').value.trim();

            alertBox.style.display = 'none';
            btnLogin.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i> Authenticating...';
            btnLogin.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, use2FA: false })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Strict check for branch manager access to the admin portal
                    if (data.user.role !== 'manager' && data.user.role !== 'admin') {
                        showAlert('Invalid Role: This portal requires valid Branch Credentials. Super Admins must use the Super Admin Gateway.');
                        btnLogin.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Authenticate';
                        btnLogin.disabled = false;
                        return;
                    }

                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));

                    btnLogin.innerHTML = '<i class="fa-solid fa-check" style="margin-right: 8px;"></i> Access Granted';
                    btnLogin.style.background = 'var(--success-color)';

                    setTimeout(() => {
                        window.location.href = 'vynster-salon.html';
                    }, 800);
                } else {
                    showAlert(data.error || 'Invalid Access Key or Password.');
                    btnLogin.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Authenticate';
                    btnLogin.disabled = false;
                }
            } catch (error) {
                console.error(error);
                showAlert('Network error: Unable to reach the authentication server.');
                btnLogin.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Authenticate';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>

</html>
