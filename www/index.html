<!DOCTYPE html>
<html>
<head>
    <title>Medika | Gateway</title>
    <script>
        // Master Gateway Logic
        (function() {
            const token = sessionStorage.getItem('adminToken') || localStorage.getItem('adminToken');
            const userStr = sessionStorage.getItem('adminUser') || localStorage.getItem('adminUser');

            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    window.location.href = 'MedhikaArts_complete_module.html';
                } catch (e) {
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        })();
    </script>
    <style>
        body { background: #05070a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00d2ff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
